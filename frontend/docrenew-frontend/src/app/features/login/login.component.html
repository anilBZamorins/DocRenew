<div
  class="min-h-screen flex items-center justify-center p-6"
  style="background: radial-gradient(900px 500px at 88% -10%, rgba(29,111,184,.35), transparent 60%), radial-gradient(700px 500px at -10% 110%, rgba(18,164,164,.28), transparent 55%), linear-gradient(135deg, var(--navy), #123a63 70%);"
>
  <div class="w-full max-w-[380px]">
    <div class="flex items-center justify-center gap-2.5 mb-6">
      <span class="w-8 h-8 rounded-[10px] grid place-items-center text-white" style="background: linear-gradient(135deg, var(--teal), var(--blue));">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-[19px] h-[19px]">
          <path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
        </svg>
      </span>
      <span class="font-display font-extrabold text-[19px] text-white">DocRenew</span>
    </div>

    <div class="w-full max-w-[380px] bg-surface rounded-[18px] px-8 py-[34px] shadow-[0_30px_80px_rgba(5,15,30,.35)]">
      <h1 class="text-[19px] font-display font-extrabold text-navy m-0 mb-1">Sign in to your workspace</h1>
      <p class="text-[12.5px] text-muted m-0 mb-5">Employee Document Renewal Management</p>

      <form [formGroup]="form" (ngSubmit)="submit()">
        <div class="mb-3.5">
          <label class="block text-[11.5px] font-bold text-muted mb-1.5 uppercase tracking-wide">Email</label>
          <input
            type="text"
            formControlName="email"
            placeholder="you@company.com"
            class="w-full border border-line bg-surface-2 text-ink rounded-[9px] px-3 py-2.5 text-[13.5px] font-sans"
          />
        </div>
        <div class="mb-3.5">
          <label class="block text-[11.5px] font-bold text-muted mb-1.5 uppercase tracking-wide">Password</label>
          <input
            type="password"
            formControlName="password"
            placeholder="••••••••••"
            class="w-full border border-line bg-surface-2 text-ink rounded-[9px] px-3 py-2.5 text-[13.5px] font-sans"
          />
        </div>

        @if (errorMessage()) {
          <div class="border-l-[3px] border-urgent bg-urgent-bg rounded-[10px] px-4 py-3 text-[12.5px] text-ink mb-3.5">
            {{ errorMessage() }}
          </div>
        }

        <button
          type="submit"
          [disabled]="submitting()"
          class="w-full border-0 rounded-[9px] py-2.5 text-[13.5px] font-bold text-white mt-1.5 disabled:opacity-60 disabled:cursor-not-allowed"
          style="background: linear-gradient(135deg, var(--teal), var(--blue));"
        >
          {{ submitting() ? 'Signing in…' : 'Sign in' }}
        </button>
      </form>
    </div>

    <div class="text-center text-[11px] text-[#9fc0e4] mt-5">DocRenew &middot; Zamorins Solutions</div>
  </div>
</div>
