<div class="px-[30px] pt-[26px] pb-[60px] max-w-[700px] mx-auto">
  <div class="mb-5">
    <div class="text-[11px] font-extrabold tracking-[.14em] uppercase text-brand-teal mb-1.5">NEW EMPLOYEE</div>
    <h1 class="text-[22px] font-display font-extrabold text-navy m-0 mb-1 tracking-tight">Add an employee</h1>
    <p class="text-[13.5px] text-muted m-0">Create the profile first — you can attach their tracked documents once it's saved.</p>
  </div>

  @if (errorMessage()) {
    <div class="border-l-[3px] border-urgent bg-urgent-bg rounded-[10px] px-4 py-3 text-[12.5px] text-ink mb-4">{{ errorMessage() }}</div>
  }

  <div class="bg-surface border border-line rounded-card px-5 py-5">
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-x-4 gap-y-3.5">
      <div class="sm:col-span-2">
        <label class="block text-[11.5px] font-bold text-muted mb-1.5 uppercase tracking-wide">Full name</label>
        <input
          type="text"
          class="w-full border border-line bg-surface-2 text-ink rounded-[9px] px-3 py-2.5 text-[13.5px] font-sans"
          [ngModel]="name()"
          (ngModelChange)="name.set($event)"
        />
      </div>

      <div>
        <label class="block text-[11.5px] font-bold text-muted mb-1.5 uppercase tracking-wide">Employee ID</label>
        <input
          type="text"
          placeholder="optional"
          class="w-full border border-line bg-surface-2 text-ink rounded-[9px] px-3 py-2.5 text-[13.5px] font-sans"
          [ngModel]="employeeCode()"
          (ngModelChange)="employeeCode.set($event)"
        />
      </div>

      <div>
        <label class="block text-[11.5px] font-bold text-muted mb-1.5 uppercase tracking-wide">Department</label>
        <input
          type="text"
          placeholder="optional"
          class="w-full border border-line bg-surface-2 text-ink rounded-[9px] px-3 py-2.5 text-[13.5px] font-sans"
          [ngModel]="department()"
          (ngModelChange)="department.set($event)"
        />
      </div>

      <div>
        <label class="block text-[11.5px] font-bold text-muted mb-1.5 uppercase tracking-wide">Job title</label>
        <input
          type="text"
          placeholder="optional"
          class="w-full border border-line bg-surface-2 text-ink rounded-[9px] px-3 py-2.5 text-[13.5px] font-sans"
          [ngModel]="jobTitle()"
          (ngModelChange)="jobTitle.set($event)"
        />
      </div>

      <div>
        <label class="block text-[11.5px] font-bold text-muted mb-1.5 uppercase tracking-wide">Manager</label>
        <select
          class="w-full border border-line bg-surface-2 text-ink rounded-[9px] px-3 py-2.5 text-[13.5px] font-sans"
          [ngModel]="managerId()"
          (ngModelChange)="managerId.set($event)"
        >
          <option value="">No manager</option>
          @for (m of managers(); track m.id) {
            <option [value]="m.id">{{ m.name }}</option>
          }
        </select>
      </div>

      <div>
        <label class="block text-[11.5px] font-bold text-muted mb-1.5 uppercase tracking-wide">Contact email</label>
        <input
          type="email"
          placeholder="optional"
          class="w-full border border-line bg-surface-2 text-ink rounded-[9px] px-3 py-2.5 text-[13.5px] font-sans"
          [ngModel]="contactEmail()"
          (ngModelChange)="contactEmail.set($event)"
        />
      </div>

      <div>
        <label class="block text-[11.5px] font-bold text-muted mb-1.5 uppercase tracking-wide">Contact phone</label>
        <input
          type="text"
          placeholder="optional"
          class="w-full border border-line bg-surface-2 text-ink rounded-[9px] px-3 py-2.5 text-[13.5px] font-sans"
          [ngModel]="contactPhone()"
          (ngModelChange)="contactPhone.set($event)"
        />
      </div>
    </div>

    <div class="mt-5 flex items-center gap-2">
      <button
        class="text-white border-0 rounded-[9px] px-4 py-2.5 text-[13.5px] font-bold disabled:opacity-60 disabled:cursor-not-allowed"
        style="background: linear-gradient(135deg, var(--teal), var(--blue));"
        [disabled]="submitting()"
        (click)="submit()"
      >
        {{ submitting() ? 'Saving…' : 'Save employee' }}
      </button>
      <a routerLink="/employees" class="border border-line bg-transparent text-ink rounded-[9px] px-4 py-2.5 text-[13.5px] font-bold no-underline">Cancel</a>
    </div>
    <p class="text-[11.5px] text-muted mt-2.5">This profile isn't linked to a sign-in account yet — that's set up separately once invitations are enabled for your tenant.</p>
  </div>
</div>
